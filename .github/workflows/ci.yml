name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --extra dev --extra google
      - run: uv run python -c "import google.auth; import googleapiclient.discovery"
      - run: uv run ruff check .
      - run: uv run pytest
