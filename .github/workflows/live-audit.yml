name: Live Workbook Audit

on:
  # Scheduled runs paused pending keyless Google Cloud authentication.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6

      - name: Install production audit dependencies
        run: uv sync --extra google

      - name: Configure Google credentials
        env:
          GOOGLE_CREDENTIALS_JSON: ${{ secrets.XPRESS_GOOGLE_CREDENTIALS }}
        run: |
          if [ -z "$GOOGLE_CREDENTIALS_JSON" ]; then
            echo "Missing repository secret XPRESS_GOOGLE_CREDENTIALS" >&2
            exit 1
          fi

          credential_file="$RUNNER_TEMP/google-credentials.json"
          printf '%s' "$GOOGLE_CREDENTIALS_JSON" > "$credential_file"
          python - "$credential_file" <<'PY'
          import json
          import sys

          path = sys.argv[1]
          try:
              with open(path, encoding="utf-8") as handle:
                  credentials = json.load(handle)
          except (OSError, json.JSONDecodeError) as exc:
              raise SystemExit(
                  "XPRESS_GOOGLE_CREDENTIALS must contain the raw service-account JSON: "
                  f"{exc}"
              ) from exc

          required = {"type", "client_email", "private_key"}
          missing = sorted(required.difference(credentials))
          if credentials.get("type") != "service_account" or missing:
              details = f"; missing fields: {', '.join(missing)}" if missing else ""
              raise SystemExit(
                  "XPRESS_GOOGLE_CREDENTIALS is not a service-account credential" + details
              )
          PY
          echo "GOOGLE_APPLICATION_CREDENTIALS=$credential_file" >> "$GITHUB_ENV"

      - name: Run read-only live audit
        run: |
          set -o pipefail
          uv run xpress-agent --live --trigger scheduled | tee live-audit-report.json
          test -s live-audit-report.json

      - name: Publish audit summary
        run: |
          echo '## Xpress live workbook audit' >> "$GITHUB_STEP_SUMMARY"
          echo '' >> "$GITHUB_STEP_SUMMARY"
          echo '```json' >> "$GITHUB_STEP_SUMMARY"
          cat live-audit-report.json >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Upload audit report
        uses: actions/upload-artifact@v4
        with:
          name: xpress-live-audit-${{ github.run_number }}
          path: live-audit-report.json
          retention-days: 30
